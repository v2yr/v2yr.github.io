*{box-sizing:border-box;margin:0}
html{background:var(--ink)}
body{
  background:
    radial-gradient(120% 60% at 50% 110%, rgba(236,232,225,.09), transparent 60%),
    linear-gradient(#08080d, #0c0a12 60%, #0a0810);
  background-color:var(--ink);
  color:var(--bone);
  font-family:var(--mono);
  font-size:15px;
  line-height:1.5;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}

.track{height:200vh;position:relative}
.stage{
  position:sticky;top:0;height:100vh;height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;
  perspective:1100px;overflow:hidden;padding:0 16px;
}
.moon{
  position:absolute;top:9%;right:8%;
  width:clamp(70px,16vw,130px);aspect-ratio:1;border-radius:50%;
  box-shadow:inset -0.28em 0.12em 0 0 var(--moon);
  font-size:clamp(70px,16vw,130px);
  will-change:transform;
}
.moon::before{ /* glow as a cheap blurred disc instead of a filter */
  content:"";position:absolute;inset:-35%;border-radius:50%;
  background:radial-gradient(circle,rgba(242,179,61,.22),transparent 65%);
}
.wordmark{
  display:flex;transform-style:preserve-3d;
  font-family:var(--display);font-weight:800;
  font-size:clamp(90px,min(40vw,22vh),300px);line-height:.8;letter-spacing:-.06em;
  color:var(--bone);user-select:none;-webkit-user-select:none;
}
.wordmark span{
  display:block;will-change:transform,opacity;
  text-shadow:2px 2px 0 #8a8791,4px 4px 0 #5c5a63,6px 6px 0 #34333a;
}

.card{
  position:relative;width:min(310px,82vw);flex:none;
  transform-style:preserve-3d;will-change:transform;
  transform:rotateY(-24deg) rotateX(6deg);
}
.card::before{ /* soft ground glow, kept off the faces so they stay cheap to composite */
  content:"";position:absolute;inset:8% -6% -12%;border-radius:40px;
  background:radial-gradient(closest-side,rgba(236,232,225,.16),transparent);
  transform:translateZ(-60px);
}
.face{
  position:relative;border-radius:22px;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;
}
.face::after{ /* sheen that slides with the turn */
  content:"";position:absolute;top:0;bottom:0;left:-100%;right:-100%;pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.11) 50%,transparent 58%);
  transform:translateX(var(--sheen,0%));will-change:transform;
}
.back{transform:rotateY(180deg);align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.banner{
  height:112px;flex:none;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 3px),
    linear-gradient(rgba(8,8,13,.15),rgba(19,19,28,.75)),
    var(--pic) center 42%/cover;
}
.avatar{
  position:relative;width:36%;aspect-ratio:1;margin:-18% 0 0 8%;flex:none;
  border-radius:50%;background:#0b0a10 var(--pic) center/cover;
  border:5px solid var(--panel);
  display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:clamp(34px,11vw,46px);line-height:1;color:var(--bone);
}
.avatar i{
  position:absolute;right:-4%;bottom:-2%;width:30%;aspect-ratio:1;border-radius:50%;
  background:var(--panel);display:grid;place-items:center;
}
.avatar i::before{
  content:"";width:62%;aspect-ratio:1;border-radius:50%;
  box-shadow:inset -4px 2px 0 0 var(--moon);transform:translate(2px,-1px);
}
.id{padding:14px 8% 9%;display:flex;flex-direction:column;gap:8px}
.id h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,13vw,52px);line-height:1;letter-spacing:-.03em}
.handle{color:var(--mute);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 9px 3px 6px;border-radius:8px;background:#1d1c27;border:1px solid var(--line);color:var(--bone);font-weight:500;
}
.chip svg{width:16px;height:16px;flex:none}
.block{max-width:720px;margin:0 auto;padding:12vh 20px 4vh;perspective:900px}
.block h2{font:500 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:18px}
.links{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.links li{will-change:transform}
.links a{
  display:flex;flex-direction:column;gap:6px;min-height:170px;justify-content:flex-end;position:relative;
  padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--panel);
  color:var(--bone);text-decoration:none;transition:background .25s,color .25s,border-color .25s;
}
.links a small{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);transition:color .25s}
.links a b{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,44px);line-height:1;letter-spacing:-.03em;overflow-wrap:anywhere}
.links a i{position:absolute;top:18px;right:22px;font-style:normal;font-size:26px;line-height:1;transition:transform .25s}
.links a:hover,.links a:active{background:var(--bone);border-color:var(--bone);color:var(--ink)}
.links a:hover small,.links a:active small{color:#3a3842}
.links a:hover i{transform:translate(4px,-4px)}
.links a:focus-visible{outline:2px solid var(--moon);outline-offset:4px}
.end{padding:8vh 20px 12vh;text-align:center;color:#55515f;font-size:12px;letter-spacing:.2em}
.back .crescent{width:84px;aspect-ratio:1;border-radius:50%;box-shadow:inset -22px 9px 0 0 var(--moon)}
.back strong{font-family:var(--display);font-weight:800;font-size:clamp(44px,14vw,58px);line-height:1;letter-spacing:-.03em}
.back span{color:var(--mute)}

.hint{
  position:absolute;bottom:22px;left:0;right:0;text-align:center;
  font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);
}
.hint::after{content:"";display:block;width:1px;height:26px;margin:8px auto 0;background:linear-gradient(var(--mute),transparent);transform-origin:top;animation:drop 1.8s ease-in-out infinite}
@keyframes drop{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

@media (prefers-reduced-motion: reduce){
  .track{height:auto}
  .stage{position:relative}
  .hint{display:none}
}
</style>

  measure();
  window.addEventListener('resize', measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  var target = 0, sy = 0, p = 0;
  function read(){ target = window.scrollY || document.documentElement.scrollTop || 0; }
  window.addEventListener('scroll', read, {passive:true});
  read(); sy = target; p = clamp(sy / span, 0, 1);

  var tx = 0, ty = 0, tiltX = 0, tiltY = 0;
  if (!reduce) window.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch') return;
    tx = (e.clientX / W - .5) * 14;
    ty = (e.clientY / H - .5) * -10;
  }, {passive:true});
  if (!reduce){
    /* on a phone the card leans a little toward the finger, then settles */
    var lean = function(e){ var f = e.touches[0]; if (!f) return; tx = (f.clientX / W - .5) * 16; ty = (f.clientY / H - .5) * -8; };
    var rest = function(){ tx = 0; ty = 0; };
    window.addEventListener('touchstart', lean, {passive:true});
    window.addEventListener('touchmove', lean, {passive:true});
    window.addEventListener('touchend', rest, {passive:true});
    window.addEventListener('touchcancel', rest, {passive:true});
  }

  function sky(t){
    cx.clearRect(0,0,W,H);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var yy = ((s.y - sy * s.z * .35) % H + H) % H;
      cx.globalAlpha = (.35 + .65 * s.z) * (.6 + .4 * Math.sin(t * .0012 * (1 + s.z) + s.ph));
      cx.fillStyle = '#ece8e1';
      var r = s.z * 1.5;
      cx.fillRect(s.x, yy, r, r);
    }
    cx.globalAlpha = 1;
  }

  var cfg = [[-1, -700, 55], [0, -1100, 0], [1, -700, -55]];
  function frame(t){
    t = t || 0;
    if (reduce){ sky(0); return; }

    /* ease the scroll position itself: this is what makes the motion glide instead of stepping */
    sy += (target - sy) * .1;
    if (Math.abs(target - sy) < .2) sy = target;
    p = clamp(sy / span, 0, 1);
    tiltX += (ty - tiltX) * .06; tiltY += (tx - tiltY) * .06;

    sky(t);

    var a = smooth(p / .85);
    var spread = W * .42;
    for (var i = 0; i < 3; i++){
      var c = cfg[i];
      letters[i].style.transform = 'translate3d(' + (c[0]*spread*a) + 'px,' + (-H*.06*a) + 'px,' + (c[1]*a) + 'px) rotateY(' + (c[2]*a) + 'deg)';
      letters[i].style.opacity = 1 - .85 * a;
    }

    var ry = lerp(-24, 0, a) + Math.sin(p * Math.PI) * 5 + tiltY;
    var rx = lerp(6, 0, a) + Math.sin(p * Math.PI * 2) * 4 + tiltX;
    var bob = Math.sin(t * .0011) * 6;
    card.style.transform = 'translate3d(0,' + (-liftMax * a + bob) + 'px,0) scale(' + (1 + .12 * a) + ') rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    var k = (((ry + 90) % 180) + 180) % 180 / 180;   /* 0..1 across each half turn */
    card.style.setProperty('--sheen', ((k - .5) * 70) + '%');

    moon.style.transform = 'translate3d(' + (-W * .62 * p) + 'px,' + (p * H * .1 - Math.sin(p * Math.PI) * H * .04) + 'px,0) rotate(' + (-40 * p) + 'deg)';
    hint.style.opacity = 1 - smooth(p / .08);

    /* lower blocks lean gently as they pass the middle of the screen */
    for (var j = 0; j < tiles.length; j++){
      var mid = tpos[j] - sy;
      if (mid < -H * .3 || mid > H * 1.3) continue;
      var off = clamp((mid - H / 2) / (H * .6), -1, 1);
      tiles[j].style.transform = 'translate3d(' + (off * (j % 2 ? -14 : 14)) + 'px,0,' + (-Math.abs(off) * 50) + 'px) rotateX(' + (-off * 16) + 'deg)';
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
